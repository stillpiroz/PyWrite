[project]
name = "pywrite"
version = "0.1.0"
description = "A lightweight rich text editor supporting bold, italic, font sizing, and more."
readme = "README.md"
authors = [
    { name = "Piroz", email = "stillpiroz@proton.me" }
]
requires-python = ">=3.14"
dependencies = [
    "pyside6>=6.12.0",
]

[project.scripts]
pywrite = "pywrite.main:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
